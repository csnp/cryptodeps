# GitHub Action for CryptoDeps
# Analyzes dependencies for quantum-vulnerable cryptographic algorithms
#
# Usage in your workflow, pinned to a release tag from
# https://github.com/csnp/cryptodeps/releases:
#   - uses: csnp/cryptodeps@v1.3.1
#     with:
#       path: '.'
#       fail-on: 'vulnerable'
#       format: 'sarif'

name: 'CryptoDeps'
description: 'Analyze dependencies for quantum-vulnerable cryptographic algorithms'
author: 'CSNP (csnp.org)'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path to analyze (directory or manifest file)'
    required: false
    default: '.'
  fail-on:
    description: 'Fail threshold: vulnerable, partial, any, none'
    required: false
    default: 'vulnerable'
  format:
    description: 'Output format: table, json, sarif, cbom, markdown'
    required: false
    default: 'table'
  version:
    description: 'CryptoDeps version to use (default: latest)'
    required: false
    default: 'latest'
  sarif-file:
    description: 'Path to write SARIF output (for GitHub Security tab)'
    required: false
    default: ''

outputs:
  vulnerable-count:
    description: 'Number of quantum-vulnerable dependencies'
    value: ${{ steps.analyze.outputs.vulnerable }}
  partial-count:
    description: 'Number of partial-risk dependencies'
    value: ${{ steps.analyze.outputs.partial }}
  total-crypto:
    description: 'Total dependencies using cryptography'
    value: ${{ steps.analyze.outputs.crypto }}
  exit-code:
    description: 'Exit code (0=clean, 1=vulnerable, 2=error, 3=partial)'
    value: ${{ steps.analyze.outputs.exit_code }}

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false

    # Inputs reach every run: script through env: and are read as quoted shell
    # variables. A ${{ }} expression inside run: is pasted into the script text
    # before bash parses it, so its value would be read as shell syntax.
    - name: Install CryptoDeps
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$INPUT_VERSION" = "latest" ]; then
          go install github.com/csnp/qramm-cryptodeps/cmd/cryptodeps@latest
        else
          go install "github.com/csnp/qramm-cryptodeps/cmd/cryptodeps@$INPUT_VERSION"
        fi

    - name: Run CryptoDeps Analysis
      id: analyze
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set +e

        # Refuse a format or fail-on value the CLI would refuse, with the exit
        # code 2 the CLI gives it. The sets are the ones the CLI accepts: format
        # also takes md and an empty value (table), and fail-on is compared in
        # lower case with surrounding whitespace removed.
        invalid_input() {
          echo "::error::$1"
          echo "vulnerable=0" >> $GITHUB_OUTPUT
          echo "partial=0" >> $GITHUB_OUTPUT
          echo "crypto=0" >> $GITHUB_OUTPUT
          echo "exit_code=2" >> $GITHUB_OUTPUT
          exit 2
        }
        case "$INPUT_FORMAT" in
          table|json|sarif|cbom|markdown|md|'') ;;
          *) invalid_input "Invalid format input $(printf '%q' "$INPUT_FORMAT"): expected one of table, json, sarif, cbom, markdown" ;;
        esac
        FAIL_ON=$(printf '%s' "$INPUT_FAIL_ON" | tr '[:upper:]' '[:lower:]')
        FAIL_ON="${FAIL_ON#"${FAIL_ON%%[![:space:]]*}"}"
        FAIL_ON="${FAIL_ON%"${FAIL_ON##*[![:space:]]}"}"
        case "$FAIL_ON" in
          vulnerable|partial|any|none) ;;
          *) invalid_input "Invalid fail-on input $(printf '%q' "$INPUT_FAIL_ON"): expected one of vulnerable, partial, any, none" ;;
        esac

        # Run analysis
        OUTPUT=$(cryptodeps analyze "$INPUT_PATH" \
          --format "$INPUT_FORMAT" \
          --fail-on "$FAIL_ON" \
          --offline 2>&1)
        EXIT_CODE=$?

        echo "$OUTPUT"

        # Parse summary for outputs (extract from table or JSON)
        if [ "$INPUT_FORMAT" = "json" ]; then
          # Workspace discovery is the default, and a multi-project document
          # carries totalSummary rather than summary. Reading only .summary made
          # every published count 0 on the default path, so the action reported
          # "0 vulnerable" for trees that were full of findings.
          SUMMARY=$(echo "$OUTPUT" | jq -r '(.totalSummary // .summary) // {}')
          VULNERABLE=$(echo "$SUMMARY" | jq -r '.quantumVulnerable // 0')
          PARTIAL=$(echo "$SUMMARY" | jq -r '.quantumPartial // 0')
          CRYPTO=$(echo "$SUMMARY" | jq -r '.withCrypto // 0')
        else
          # Default counts if not parseable
          VULNERABLE=0
          PARTIAL=0
          CRYPTO=0
        fi

        echo "vulnerable=$VULNERABLE" >> $GITHUB_OUTPUT
        echo "partial=$PARTIAL" >> $GITHUB_OUTPUT
        echo "crypto=$CRYPTO" >> $GITHUB_OUTPUT
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

        exit $EXIT_CODE

    - name: Generate SARIF Report
      # !cancelled(), not success(): the analysis step above ends with
      # `exit $EXIT_CODE` and its default threshold exits 1 on any vulnerable
      # finding, so the implicit success() skipped the SARIF steps for every
      # repository that had something to report. Not always() either, which
      # GitHub documents as running even on cancellation: a cancelled run would
      # then still push a report into the Security tab.
      if: ${{ !cancelled() && inputs.sarif-file != '' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        # A non-zero exit here must not stop the upload. --fail-on none silences
        # the finding-based exit codes, but exit 2 still reports an analysis
        # error such as a manifest that could not be read, and that report is
        # precisely the one worth sending to the Security tab. Composite bash
        # steps run under -e, so without this the step failed and the upload
        # below never ran. Only a missing or empty document is a real failure.
        set +e
        cryptodeps analyze "$INPUT_PATH" \
          --format sarif \
          --fail-on none \
          --offline > "$INPUT_SARIF_FILE"
        EXIT_CODE=$?
        set -e

        if [ ! -s "$INPUT_SARIF_FILE" ]; then
          echo "::error::cryptodeps wrote no SARIF output (exit $EXIT_CODE)"
          exit 1
        fi
        if [ "$EXIT_CODE" -ne 0 ]; then
          echo "::warning::cryptodeps exited $EXIT_CODE. The SARIF report may be incomplete; see runs[].invocations[].toolExecutionNotifications for what was not analyzed."
        fi

    - name: Upload SARIF to GitHub Security
      if: ${{ !cancelled() && inputs.sarif-file != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: cryptodeps
